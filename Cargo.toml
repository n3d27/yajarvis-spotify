[package]
name = "spotify-plugin"
version = "0.1.1"
edition = "2024"
license = "MIT"

[lib]
name = "spotify_core"
path = "src/lib.rs"

[[bin]]
name = "spotify-plugin"
path = "src/main.rs"

[dependencies]
jarvis-plugin-sdk = { git = "https://github.com/newfpv/YaJarvis", tag = "v0.10.18", features = ["process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-util", "io-std", "process", "time", "sync"] }

ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-util", "process", "time"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
panic = "abort"
codegen-units = 1
